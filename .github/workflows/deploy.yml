# Builds the website and uploads it to the cPanel hosting of powerfix.rw.
# Runs on every push to main (i.e. when a pull request is merged) and can be
# started by hand from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      e.g. ftp.powerfix.rw
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
# Optional:
#   FTP_SERVER_DIR  folder of the website on the server, with a trailing slash.
#                   Defaults to public_html/ (right for the main cPanel account).
#                   Use ./ if the FTP account opens directly inside public_html.

name: Deploy to powerfix.rw

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the website
        run: npx vite build

      - name: Check the build
        run: |
          test -f dist/public/index.html
          test -f dist/public/.htaccess
          test -f dist/public/api/contact.php

      - name: Upload to cPanel over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/public/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.DS_Store
            **/*.gz
